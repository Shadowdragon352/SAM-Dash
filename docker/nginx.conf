server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 8m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/healthz {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $health_upstream http://api:5000;
        proxy_pass $health_upstream/;
    }

    location /api/ {
        # Docker DNS is resolved for every connection after the cache expires;
        # the API can be recreated without leaving nginx on a stale container IP.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:5000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location / {
        # React Router paths such as /login must return the SPA entry point.
        try_files $uri $uri/ /index.html;
    }
}
